name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: テスト
        run: swift test
      - name: アプリを作る
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          scripts/build-app.sh "$v"
      - uses: actions/upload-artifact@v4
        with:
          name: Cooltime
          path: build/Cooltime.zip
      - name: リリースに添付（v* のタグのとき）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Cooltime.zip
